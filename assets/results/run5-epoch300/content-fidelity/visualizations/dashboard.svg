t match</text><text x="550" y="398" class="small" style="fill:#2563eb">0.01019 ± 0.00778</text><text x="805" y="398" class="small" style="fill:#dc2626">0.01800 ± 0.01815</text><text x="1060" y="398" class="small">+0.00781 ± 0.01867</text><rect x="40" y="409" width="1260" height="31" fill="#f8fafc"/><text x="40" y="429" class="small">hr_gradient_cosine_std_over_samples</text><text x="280" y="429" class="small">higher = better edge/layout match</text><text x="550" y="429" class="small" style="fill:#2563eb">0.00545 ± 0.00500</text><text x="805" y="429" class="small" style="fill:#dc2626">0.01077 ± 0.01113</text><text x="1060" y="429" class="small">+0.00532 ± 0.01044</text><text x="40" y="460" class="small">target_lowpass_l1_std_over_samples</text><text x="280" y="460" class="small">lower = closer to target LR-A</text><text x="550" y="460" class="small" style="fill:#2563eb">0.00714 ± 0.00254</text><text x="805" y="460" class="small" style="fill:#dc2626">0.00832 ± 0.00315</text><text x="1060" y="460" class="small">+0.00117 ± 0.00335</text><rect x="40" y="471" width="1260" height="31" fill="#f8fafc"/><text x="40" y="491" class="small">target_lowpass_ssim_std_over_samples</text><text x="280" y="491" class="small">higher = closer to target LR-A</text><text x="550" y="491" class="small" style="fill:#2563eb">0.00914 ± 0.00697</text><text x="805" y="491" class="small" style="fill:#dc2626">0.01782 ± 0.01990</text><text x="1060" y="491" class="small">+0.00868 ± 0.01989</text><text x="40" y="522" class="small">variance_pixel_l1</text><text x="280" y="522" class="small">higher = more sample variation</text><text x="550" y="522" class="small" style="fill:#2563eb">0.03573 ± 0.00975</text><text x="805" y="522" class="small" style="fill:#dc2626">0.03759 ± 0.00917</text><text x="1060" y="522" class="small">+0.00186 ± 0.00529</text><rect x="40" y="533" width="1260" height="31" fill="#f8fafc"/><text x="40" y="553" class="small">variance_lowpass_l1</text><text x="280" y="553" class="small"