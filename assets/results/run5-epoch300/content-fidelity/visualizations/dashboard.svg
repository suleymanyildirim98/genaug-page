<rect width="100%" height="100%" fill="#ffffff"/><text x="40" y="42" class="title">Content-fidelity metrics</text><text x="40" y="74" class="small">All values are mean ± standard deviation across examples. Same/cross identifies the source capture for LR-B.</text><text x="40" y="98" class="small">Metrics ending in _std_over_samples measure variability of that metric across the generated samples for one input.</text><rect x="40" y="109" width="1260" height="25" fill="#e2e8f0"/><text x="40" y="128" class="label">Metric</text><text x="280" y="128" class="label">Interpretation</text><text x="550" y="128" class="label">Same capture</text><text x="805" y="128" class="label">Cross capture</text><text x="1060" y="128" class="label">Cross − same</text><text x="40" y="150" class="small">hr_lowpass_l1</text><text x="280" y="150" class="small">lower = better content match</text><text x="550" y="150" class="small" style="fill:#2563eb">0.02999 ± 0.01032</text><text x="805" y="150" class="small" style="fill:#dc2626">0.03243 ± 0.01081</text><text x="1060" y="150" class="small">+0.00245 ± 0.00632</text><rect x="40" y="161" width="1260" height="31" fill="#f8fafc"/><text x="40" y="181" class="small">hr_lowpass_psnr</text><text x="280" y="181" class="small">higher = better content match</text><text x="550" y="181" class="small" style="fill:#2563eb">29.35170 ± 3.14237</text><text x="805" y="181" class="small" style="fill:#dc2626">28.60202 ± 2.74580</text><text x="1060" y="181" class="small">-0.74967 ± 1.79730</text><text x="40" y="212" class="small">hr_lowpass_ssim</text><text x="280" y="212" class="small">higher = better content match</text><text x="550" y="212" class="small" style="fill:#2563eb">0.93539 ± 0.04317</text><text x="805" y="212" class="small" style="fill:#dc2626">0.92173 ± 0.05859</text><text x="1060" y="212" class="small">-0.01366 ± 0.03618</text><rect x="40" y="223" width="1260" height="31" fill="#f8fafc"/><text x="40" y="243" class="small">hr_gradient_cosine</text><text 