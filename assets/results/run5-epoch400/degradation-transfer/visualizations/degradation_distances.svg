<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="448" viewBox="0 0 1000 448">
<style>text { font-family: Arial, sans-serif; fill: #172033; } .title { font-size: 25px; font-weight: 700; } .label { font-size: 15px; } .small { font-size: 13px; fill: #4b5563; } .value { font-size: 14px; font-weight: 600; }</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="42" class="title">deresnet degradation agreement</text><text x="40" y="75" class="small">Cosine distance in the frozen deresnet feature space.</text><text x="40" y="127" class="label">Input low ↔ high separation</text><rect x="300.0" y="102" width="487.0" height="28" rx="4" fill="#7c3aed"/><text x="795.0" y="123" class="value">+0.40157  (larger = a valid test)</text><text x="40" y="191" class="label">Generated low ↔ high separation</text><rect x="300.0" y="166" width="117.2" height="28" rx="4" fill="#0891b2"/><text x="425.2" y="187" class="value">+0.09667  (larger = conditions change output)</text><text x="40" y="255" class="label">Low output → low target</text><rect x="300.0" y="230" width="22.1" height="28" rx="4" fill="#2563eb"/><text x="330.1" y="251" class="value">+0.01824  (lower = better)</text><text x="40" y="319" class="label">High output → high target</text><rect x="300.0" y="294" width="397.6" height="28" rx="4" fill="#dc2626"/><text x="705.6" y="315" class="value">+0.32791  (lower = better)</text></svg>