<text x="40" y="42" class="title">Image detail: Laplacian variance</text><text x="40" y="75" class="small">Lower usually means less fine detail / more blur; compare generated ordering with reference ordering.</text><text x="40" y="127" class="label">Reference low condition</text><rect x="300.0" y="102" width="487.0" height="28" rx="4" fill="#2563eb"/><text x="795.0" y="123" class="value">+0.01058</text><text x="40" y="191" class="label">Reference high condition</text><rect x="300.0" y="166" width="47.4" height="28" rx="4" fill="#dc2626"/><text x="355.4" y="187" class="value">+0.00103</text><text x="40" y="255" class="label">Generated low</text><rect x="300.0" y="230" width="449.6" height="28" rx="4" fill="#2563eb"/><text x="757.6" y="251" class="value">+0.00977</text><text x="40" y="319" class="label">Generated high</text><rect x="300.0" y="294" width="218.0" height="28" rx="4" fill="#dc2626"/><text x="526.0" y="315" class="value">+0.00474</text><text x="40" y="383" class="label">Null control</text><rect x="300.0" y="358" width="26.6" height="28" rx="4" fill="#6b7280"/><text x="334.6" y="379" class="value">+0.00058</text></svg>