<text x="40" y="42" class="title">deresnet condition preference margin</text><text x="40" y="75" class="small">Margin = distance to opposite target − distance to assigned target.</text><line x1="580.0" y1="100" x2="580.0" y2="248" stroke="#94a3b8" stroke-width="2"/><text x="40" y="127" class="label">Low-conditioned outputs</text><rect x="580.0" y="102" width="243.5" height="28" rx="4" fill="#2563eb"/><text x="831.5" y="123" class="value">+0.49559  (positive = correct target wins)</text><text x="40" y="191" class="label">High-conditioned outputs</text><rect x="469.2" y="166" width="110.8" height="28" rx="4" fill="#dc2626"/><text x="588.0" y="187" class="value">-0.22562  (negative = opposite target wins)</text></svg>