<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="304" viewBox="0 0 1000 304">
<style>text { font-family: Arial, sans-serif; fill: #172033; } .title { font-size: 25px; font-weight: 700; } .label { font-size: 15px; } .small { font-size: 13px; fill: #4b5563; } .value { font-size: 14px; font-weight: 600; }</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="42" class="title">Correct condition identification</text><text x="40" y="75" class="small">Each output is assigned to whichever target (low or high) is closer in deresnet space.</text><text x="40" y="127" class="label">Low-conditioned outputs</text><rect x="300.0" y="102" width="487.0" height="28" rx="4" fill="#2563eb"/><text x="795.0" y="123" class="value">+1.00000  (1.0 = every sample correct)</text><text x="40" y="191" class="label">High-conditioned outputs</text><rect x="300.0" y="166" width="60.9" height="28" rx="4" fill="#dc2626"/><text x="368.9" y="187" class="value">+0.12500  (0.5 = chance)</text></svg>